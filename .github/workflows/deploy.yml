name: deploy

# main 推送或手动触发时构建并发布到 Cloudflare（wrangler.jsonc）。
# 配好 secret 后把仓库变量 DEPLOY_ENABLED 设为 true 才运行，见 docs/guides/deployment.md。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://armadra.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://armadra.com' }}
      - name: 站内链接
        run: pnpm check:links
      - name: 发布到 Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
