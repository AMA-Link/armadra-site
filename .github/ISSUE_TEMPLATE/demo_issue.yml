name: 在线演示问题 / Demo issue
description: 在线演示（/demo）的表现与软件不一致、卡顿或无法操作。 / The live demo differs from the app, stutters or cannot be operated.
title: "[Demo] "
labels: ["demo", "needs-triage"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 问题类型 / Kind
      options:
        - 与软件行为不一致 / Differs from the app
        - 交互无响应 / Interaction does not respond
        - 性能或卡顿 / Performance
        - 布局错乱 / Broken layout
        - 键盘或读屏 / Keyboard or screen reader
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 在演示的哪一步、做了什么、看到什么。 / Which step of the demo, what you did and what you saw.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 浏览器与设备 / Browser and device
    validations:
      required: true
