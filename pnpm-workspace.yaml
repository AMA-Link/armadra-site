allowBuilds:
  esbuild: true
  # 只有 wrangler dev 需要 workerd 的二进制；部署与 dry-run 不需要
  workerd: false

overrides:
  # @napi-rs/wasm-runtime 的 @emnapi/runtime 范围放进了 2.0.0-beta.2（经
  # @astrojs/check 的语言服务与 rolldown 的 wasm 绑定），astro check 一加载它
  # 就崩。其余依赖都在 1.11.x，钉回同一份；上游收紧范围或 2.0 正式版可用后删掉。
  "@emnapi/runtime@>=2.0.0-0": 1.11.3
